name: Decompile Minecraft 1.8.9 (fontes para consulta)

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Instalar Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
          echo "$PWD/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Decompilar (setupDecompWorkspace)
        run: gradle setupDecompWorkspace --no-daemon --stacktrace

      - name: Localizar fontes decompilados
        run: |
          mkdir -p decomp-out
          find ~/.gradle -name 'forgeSrc*sources*.jar' -exec cp -v {} decomp-out/ \;
          if [ -z "$(ls -A decomp-out)" ]; then
            find ~/.gradle -path '*minecraftforge/forge*' -name '*sources*.jar' -exec cp -v {} decomp-out/ \;
          fi
          ls -la decomp-out

      - name: Enviar fontes
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.8.9-fontes
          path: decomp-out/*
